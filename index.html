      pointer-events: none;
      z-index: 0;

    .glow-field::before {
      content: '';
      position: absolute;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0,200,255,0.08) 0%, transparent 70%);
    }

    .glow-field::after {
      content: '';
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,0.07) 0%, transparent 65%);
